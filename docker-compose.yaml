name: gogopher
services:
  gogopher:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: "gogopher"
    volumes:
      - ./gopher-root:/gopher-root
    environment:
      - TITLE="Wes C's Gopher Server"
      - PORT=70
      - HOST_BIND_IP=0.0.0.0
      - GOPHER_ROOT=/gopher-root
    ports:
      - '7070:70'
